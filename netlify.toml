# Netlify settings for games.codebread.fun.
# The site is static files in public/ plus one function (netlify/functions/api.ts) that answers /api/*.

[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pg only loads its optional native driver when asked to, and this site never asks
  external_node_modules = ["pg-native"]

# The game may be shown inside the portfolio (an iframe), but not inside anyone else's site.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://codebread.fun https://*.codebread.fun http://localhost:*"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The admin page is never framed and kept out of search engines.
[[headers]]
  for = "/admin"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"
